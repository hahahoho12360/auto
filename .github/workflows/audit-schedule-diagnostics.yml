name: Audit schedule diagnostics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-schedule-diagnostics.yml']
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect workflow registration and recent runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          repo = os.environ['GH_REPO']
          base = 'https://api.github.com/repos/' + repo
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json', 'User-Agent':'education-audit-diagnostics'}
          def get(path):
              try:
                  with urllib.request.urlopen(urllib.request.Request(base+path, headers=headers), timeout=20) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  return {'http_status':e.code}
          wf=get('/actions/workflows/education-audit.yml')
          print('WORKFLOW '+json.dumps({k:wf.get(k) for k in ('id','name','path','state','created_at','updated_at','html_url','http_status')}, ensure_ascii=False))
          for event in ('schedule','push','workflow_dispatch'):
              data=get('/actions/runs?event='+event+'&per_page=10')
              rows=[{k:r.get(k) for k in ('id','name','path','event','status','conclusion','created_at','run_started_at','head_sha','html_url')} for r in data.get('workflow_runs',[])]
              print('RUNS '+json.dumps({'event':event,'total_count':data.get('total_count'),'http_status':data.get('http_status'),'runs':rows},ensure_ascii=False))
          PY
